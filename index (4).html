<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maria the Mouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <div class="name-tag">Maria</div>

  <div id="mouse" class="mouse happy">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="face">
      <div class="eye"></div>
      <div class="eye"></div>
      <div class="nose"></div>
    </div>
  </div>

  <div class="bubble" id="bubble">Hi… 🐭</div>

  <div class="mood">
    <span>Mood</span>
    <div class="bar">
      <div id="moodFill"></div>
    </div>
  </div>
</div>
<button id="feedBtn">🍎 Feed Maria</button>
<audio id="purr" src="purr.mp3"></audio>
<audio id="chirp" src="chirp.mp3"></audio>

<script src="app.js"></script>
</body>
</html>
